# Telescope services
[telescope.pocstop]
    # Controls the overall movement of the telescope mechanisms
    service = nickelpoco
    keyword = POCSTOP
[telescope.secpa]
    # Actual secondary position
    service = nickelpoco
    keyword = POCSECPA
[telescope.secpd]
    # Desired secondary position
    service = nickelpoco
    keyword = POCSECPD
[telescope.seclk]
    # Controls the secondary locking mechanism
    service = nickelpoco
    keyword = POCSECLK


# Unsure about:
#   - scratchdir: are RECORDDIR and SCRATCHDIR the same for the UCAM?
#   - prefix: I think this is right; i.e., OUTFILE is just the prefix not the full file name
#   - expresult: Was this saved by the UCAM?
#   - expbin: The old code did not use this.

# Camera services
[camera.exprec]
    # Boolean flag that image should be recorded
    service = nickucam
    keyword = RECORD
[camera.scratchdir]
    # Directory for scratch images
    service = nickucam
    keyword = OUTDIR
[camera.recorddir]
    # Directory for recorded images
    service = nickucam
    keyword = OUTDIR
[camera.prefix]
    # Image name prefix (e.g., 'n')
    service = nickucam
    keyword = OUTFILE
[camera.obsnum]
    # Number for *next* image
    service = nickucam
    keyword = OBSNUM
[camera.suffix]
    # Recorded image file suffix (e.g., 'fits')
    service = nickucam
    keyword = RECORD_SUFFIX
#[camera.expresult]
#    # Path to most recently recorded exposure
#    service = nscicam
#    keyword = EXPRESULT
[camera.expspeed]
    service = nickucam
    keyword = READSPEED
    options = Slow, Fast
#[camera.expbin] 
#    service = nscicam
#    keyword = BINNING
#    options = "1,1", "2,2", "4,4"
[camera.expstate]
    # State of the camera exposures
    service = nickucam
    keyword = EVENT
    ready = ControllerReady
    start = ExposureBegin
[camera.expstart]
    # Service used to start an exposure
    service = nickucam
    keyword = START
    start = Yes
[camera.exptime]
    # Integration time
    service  = nickucam
    keyword = EXPOSURE
